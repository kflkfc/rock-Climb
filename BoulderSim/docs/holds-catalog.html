<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>岩点图鉴 · Boulder Sim</title>
<style>
  :root { --bg:#E6D9B5; --ink:#4F3F30; --green:#2B3933; --card:#cdbd95; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font-family: system-ui,"PingFang SC",sans-serif; }
  header { background:var(--green); color:#F5EBD3; padding:18px 24px; }
  header h1 { margin:0; font-size:22px; letter-spacing:1px; }
  header p { margin:6px 0 0; font-size:13px; opacity:.85; }
  .legend { display:flex; gap:18px; flex-wrap:wrap; padding:12px 24px; font-size:13px;
    background:#d8c9a3; border-bottom:1px solid #b9a886; }
  .legend span { display:inline-flex; align-items:center; gap:6px; }
  .dot { width:14px; height:14px; border-radius:3px; display:inline-block; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:18px; padding:24px; max-width:1200px; margin:0 auto; }
  .card { background:var(--card); border:1px solid #a8966f; border-radius:12px;
    padding:14px; box-shadow:0 2px 8px rgba(60,45,30,.15); }
  .card canvas { display:block; width:100%; height:200px; border-radius:8px; background:#efe6cd; }
  .card h2 { margin:10px 0 2px; font-size:18px; }
  .card .en { font-size:12px; color:#7a6a55; letter-spacing:1px; text-transform:uppercase; }
  .card .row { font-size:13px; margin-top:8px; line-height:1.5; }
  .card .row b { color:var(--green); }
  .tag { display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px;
    color:#fff; margin-left:6px; vertical-align:middle; }
</style>
</head>
<body>
<header>
  <h1>🧗 岩点图鉴 · Hold Catalog</h1>
  <p>绿色扇形 = 该岩点能承受力的方向（受力锥）。箭头 = 你要往这个方向拉/推。半透明小人 = 身体重心该落在哪一侧。锥越窄 = 方向越挑、越难吃住。</p>
</header>
<div class="legend">
  <span><i class="dot" style="background:#5F9A6A"></i>受力锥 / 对齐方向</span>
  <span><i class="dot" style="background:#D64A47"></i>错误方向 → 抓不住</span>
  <span>锥宽 = 容错；锥窄 = 对身体位置要求高</span>
</div>
<div class="grid" id="grid"></div>

<script>
const TAU = Math.PI*2, D = Math.PI/180;
// pullDir: 你对岩点施力的方向（屏幕坐标 y 向下：右=0, 下=PI/2, 左=PI, 上=-PI/2）
const HOLDS = [
  { key:"jug", cn:"大水罐", color:"#5F9A6A", pullDir:Math.PI/2, tol:70*D,
    grip:"整手抓握，最舒服", force:"几乎全向、主要向下挂",
    body:"身体可在下方较大范围，容错最高" },
  { key:"crimp", cn:"小棱", color:"#B23A57", pullDir:Math.PI/2, tol:42*D,
    grip:"指尖扣（开掌/半扣/全扣）", force:"向下扣，方向较挑",
    body:"重心需挂在岩点正下方" },
  { key:"pinch", cn:"捏点", color:"#6B4A8C", pullDir:Math.PI/2, tol:48*D,
    grip:"拇指与四指对捏", force:"靠捏合力，向里夹+向下",
    body:"重心下方，靠捏力维持" },
  { key:"sloper", cn:"滑面", color:"#E5A636", pullDir:Math.PI/2, tol:36*D,
    grip:"开掌摩擦 + 身体张力", force:"必须正下方压，最依赖重心",
    body:"重心要正正挂在下方，偏一点就滑" },
  { key:"sidepull", cn:"侧拉", color:"#3E8E9C", pullDir:Math.PI, tol:30*D,
    grip:"侧向拉，身体倒向反侧", force:"横向受力——往一侧拉",
    body:"身体必须倒/转向相反一侧产生张力" },
  { key:"undercling", cn:"下扣", color:"#C77D3A", pullDir:-Math.PI/2, tol:40*D,
    grip:"手心向上往上抠 + 脚下蹬", force:"向上受力，手脚上下对抗",
    body:"靠手向上、脚向下的上下对抗稳住" },
  { key:"gaston", cn:"推拉(加斯顿)", color:"#9C5BA0", pullDir:0, tol:30*D,
    grip:"肘朝外，像扒开电梯门往外推", force:"外推——与侧拉相反",
    body:"身体在另一侧，靠外推产生张力" },
];

function arrow(ctx, x, y, ang, len, color, w){
  const ex = x+Math.cos(ang)*len, ey = y+Math.sin(ang)*len;
  ctx.strokeStyle=color; ctx.fillStyle=color; ctx.lineWidth=w; ctx.lineCap="round";
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(ex,ey); ctx.stroke();
  const a=ang, h=9;
  ctx.beginPath();
  ctx.moveTo(ex,ey);
  ctx.lineTo(ex-Math.cos(a-0.4)*h, ey-Math.sin(a-0.4)*h);
  ctx.lineTo(ex-Math.cos(a+0.4)*h, ey-Math.sin(a+0.4)*h);
  ctx.closePath(); ctx.fill();
}

function drawShape(ctx, h, cx, cy, s){
  ctx.save(); ctx.translate(cx,cy);
  ctx.fillStyle=h.color; ctx.strokeStyle="rgba(40,30,20,.35)"; ctx.lineWidth=2;
  ctx.beginPath();
  switch(h.key){
    case "jug": // 大而深，带下方凹口
      ctx.ellipse(0,-4,s*1.05,s*0.8,0,0,TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.fillStyle="rgba(20,15,10,.35)";
      ctx.ellipse(0,s*0.35,s*0.7,s*0.28,0,0,TAU); ctx.fill(); break;
    case "crimp": // 细小尖棱
      ctx.moveTo(-s*0.9,s*0.3); ctx.lineTo(0,-s*0.5); ctx.lineTo(s*0.9,s*0.3);
      ctx.closePath(); ctx.fill(); ctx.stroke(); break;
    case "pinch": // 竖直凸起
      ctx.ellipse(0,0,s*0.55,s*1.0,0,0,TAU); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.fillStyle="rgba(255,255,255,.2)";
      ctx.ellipse(-s*0.2,0,s*0.16,s*0.7,0,0,TAU); ctx.fill(); break;
    case "sloper": // 光滑大圆鼓
      ctx.arc(0,s*0.2,s*1.0,Math.PI,0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.fillStyle="rgba(255,255,255,.25)";
      ctx.ellipse(-s*0.3,-s*0.1,s*0.3,s*0.16,0,0,TAU); ctx.fill(); break;
    case "sidepull": // 竖向侧脸的边
      ctx.moveTo(-s*0.3,-s); ctx.quadraticCurveTo(s*0.7,-s*0.4,s*0.6,0);
      ctx.quadraticCurveTo(s*0.7,s*0.4,-s*0.3,s); ctx.lineTo(-s*0.5,s*0.9);
      ctx.quadraticCurveTo(-s*0.2,0,-s*0.5,-s*0.9); ctx.closePath();
      ctx.fill(); ctx.stroke(); break;
    case "undercling": // 朝下的倒扣（开口向下的弧）
      ctx.arc(0,-s*0.2,s*1.0,0,Math.PI); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.beginPath(); ctx.fillStyle="rgba(20,15,10,.3)";
      ctx.ellipse(0,s*0.15,s*0.7,s*0.22,0,0,TAU); ctx.fill(); break;
    case "gaston": // 侧拉镜像
      ctx.moveTo(s*0.3,-s); ctx.quadraticCurveTo(-s*0.7,-s*0.4,-s*0.6,0);
      ctx.quadraticCurveTo(-s*0.7,s*0.4,s*0.3,s); ctx.lineTo(s*0.5,s*0.9);
      ctx.quadraticCurveTo(s*0.2,0,s*0.5,-s*0.9); ctx.closePath();
      ctx.fill(); ctx.stroke(); break;
  }
  ctx.restore();
}

function render(canvas, h){
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const W = canvas.clientWidth, H = 200;
  canvas.width = W*dpr; canvas.height = H*dpr;
  const ctx = canvas.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2, s=32, R=64;
  // 受力锥（绿色扇形）
  ctx.save();
  ctx.fillStyle="rgba(95,154,106,.30)";
  ctx.beginPath(); ctx.moveTo(cx,cy);
  ctx.arc(cx,cy,R,h.pullDir-h.tol,h.pullDir+h.tol); ctx.closePath(); ctx.fill();
  // 锥边虚线
  ctx.strokeStyle="rgba(95,154,106,.55)"; ctx.setLineDash([4,4]); ctx.lineWidth=1.5;
  [h.pullDir-h.tol,h.pullDir+h.tol].forEach(a=>{
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R); ctx.stroke();
  });
  ctx.setLineDash([]);
  ctx.restore();
  // 身体重心提示（受力方向那一侧的半透明小人头）
  const bx=cx+Math.cos(h.pullDir)*(R+18), by=cy+Math.sin(h.pullDir)*(R+18);
  ctx.fillStyle="rgba(80,63,48,.30)";
  ctx.beginPath(); ctx.arc(bx,by,12,0,TAU); ctx.fill();
  ctx.fillStyle="rgba(80,63,48,.55)"; ctx.font="10px system-ui"; ctx.textAlign="center";
  ctx.fillText("重心",bx,by+3);
  // 岩点本体
  drawShape(ctx,h,cx,cy,s);
  // 受力方向箭头
  arrow(ctx,cx,cy,h.pullDir,R-6,"#3f7a48",3);
}

const grid = document.getElementById("grid");
HOLDS.forEach(h=>{
  const card=document.createElement("div"); card.className="card";
  const cv=document.createElement("canvas"); card.appendChild(cv);
  const tolDeg=Math.round(h.tol/D*2);
  card.insertAdjacentHTML("beforeend",
    `<div class="en">${h.key}</div>
     <h2>${h.cn}<span class="tag" style="background:${h.color}">锥宽 ${tolDeg}°</span></h2>
     <div class="row"><b>怎么抓：</b>${h.grip}</div>
     <div class="row"><b>受力：</b>${h.force}</div>
     <div class="row"><b>身体：</b>${h.body}</div>`);
  grid.appendChild(card);
  requestAnimationFrame(()=>render(cv,h));
});
window.addEventListener("resize",()=>{
  document.querySelectorAll(".card").forEach((c,i)=>render(c.querySelector("canvas"),HOLDS[i]));
});
</script>
</body>
</html>
